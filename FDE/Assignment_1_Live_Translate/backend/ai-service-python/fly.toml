# fly.toml app configuration file generated for fde-live-translate-ai-old-frog-2649 on 2026-07-12T17:05:22-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fde-live-translate-ai-old-frog-2649'
primary_region = 'sjc'

[build]
[env]
  MODEL = 'claude-sonnet-4-6'
  TRANSLATION_DB_PATH = '/data/translations.db'

[[mounts]]
  source = 'translate_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
